<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pilot shot 01: tiles</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  body:not(.render) { background: #222 url(../../plates/barcelona/bcn1-tiles.png) center / auto 100vh no-repeat; }
  svg { display: block; width: auto; height: 100vh; margin: 0 auto; }
  body.render svg { width: 1080px; height: 1920px; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../lib/gsap.min.js"></script>
<script src="../../lib/characters.js"></script>
<script>
/* Pilot, shot 01 (0:18): Kuwolskii and Kolurin land on the Passeig de Gràcia
 * tiles. Cartoon layer only - tools/composite.js lays it over the Veo plate
 * plates/barcelona/video/bcn1-tiles-veo.mp4. */
const C = PauseCharacters, INK = C.INK, PAPER = C.PAPER;
const DURATION = 4.5;
const LK = { x: 380, y: 1700, s: 1.05 }, CK = { x: 760, y: 1650, s: 0.98 };
const svg = document.getElementById("stage");
const shadow = (id, c) =>
  `<g id="${id}Shadow" opacity="0" transform="translate(${c.x},${c.y}) matrix(1,0,-1.1,0.26,0,0) translate(${-c.x},${-c.y})" filter="url(#flat)">
     <use href="#${id}"/></g>
   <ellipse id="${id}Contact" cx="${c.x + 8}" cy="${c.y + 4}" rx="${165 * c.s}" ry="${20 * c.s}" fill="#120c06" opacity="0" filter="url(#soft)"/>`;

svg.innerHTML = `
<defs>${C.defs}
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="flat"><feFlood flood-color="#1b1208"/><feComposite in2="SourceAlpha" operator="in"/><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="sunlit" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence id="pencilNoise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feColorMatrix in="d" type="matrix" values="1.04 0 0 0 0.02  0 0.97 0 0 0.01  0 0 0.86 0 0  0 0 0 1 0"/>
  </filter>
</defs>
<g id="camera">
  ${shadow("lk", LK)}${shadow("ck", CK)}
  <g filter="url(#sunlit)">
    <g transform="scale(1)">${C.locs("lk", LK.s)}</g>
    <g>${C.cap("ck", CK.s)}</g>
  </g>
  <g id="fx"></g>
</g>
<text id="title" x="540" y="430" text-anchor="middle" font-family="Permanent Marker, cursive" font-size="120"
      fill="#fff" stroke="${INK}" stroke-width="14" paint-order="stroke" stroke-linejoin="round" opacity="0">barcelona.</text>`;

const $ = (s) => document.querySelector(s);
const O = { svgOrigin: "0 0" };
const tl = gsap.timeline({ paused: true });
function el(tag, attrs, parent) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || $("#fx")).appendChild(n);
  return n;
}
function mouth(who, name, t) {
  document.querySelectorAll(`[id^="${who}-mouth-"]`).forEach((m) =>
    tl.set(m, { opacity: m.id === `${who}-mouth-${name}` ? 1 : 0 }, t));
}
function dust(x, y, t) {
  for (let i = 0; i < 7; i++) {
    const s = i % 2 ? 1 : -1, c = el("circle", { cx: x, cy: y - 6, r: 12 + (i % 3) * 6, fill: "#e8dccb", stroke: INK, "stroke-width": 4, opacity: 0 });
    tl.set(c, { opacity: 0.95 }, t)
      .fromTo(c, { attr: { cx: x + s * 24, cy: y - 6 } }, { attr: { cx: x + s * (90 + i * 16), cy: y - 24 - (i % 3) * 18 }, duration: 0.5, ease: "power2.out" }, t)
      .to(c, { attr: { r: 0 }, duration: 0.5, ease: "power2.in" }, t);
  }
}
function fall(who, c, t, dur) {
  tl.set(`#${who}`, { x: c.x, y: -700 }, 0)
    .to(`#${who}`, { y: c.y, duration: dur, ease: "power2.in" }, t)
    .fromTo(`#${who}-squash`, { ...O, scaleY: 1.2, scaleX: 0.88 }, { ...O, scaleY: 1.2, scaleX: 0.88, duration: dur }, t)
    .to(`#${who}-squash`, { ...O, scaleY: 0.76, scaleX: 1.18, duration: 0.07, ease: "power2.out" }, t + dur)
    .to(`#${who}-squash`, { ...O, scaleY: 1, scaleX: 1, duration: 0.5, ease: "elastic.out(1.1,0.4)" }, t + dur + 0.07)
    .to([`#${who}Shadow`], { opacity: 0.55, duration: 0.15 }, t + dur - 0.12)
    .to([`#${who}Contact`], { opacity: 0.55, duration: 0.15 }, t + dur - 0.12);
  dust(c.x, c.y, t + dur);
}
function gun(on, t) { tl.set("#ck-handR", { opacity: on ? 0 : 1 }, t).set("#ck-gun", { opacity: on ? 1 : 0 }, t); }

// rest poses
tl.set(["#lk-armL", "#ck-armL"], { ...O, rotation: -4 }, 0)
  .set(["#lk-armR", "#ck-armR"], { ...O, rotation: 4 }, 0);

// follow Veo's slow push-in so the cast stays glued to the tiles
tl.fromTo("#camera", { ...O, svgOrigin: "540 760", scale: 1 }, { svgOrigin: "540 760", scale: 1.06, duration: DURATION, ease: "none" }, 0);

fall("lk", LK, 0.5, 0.45);
fall("ck", CK, 1.05, 0.42);
// look around at the real city
tl.to("#lk-face", { x: -14, duration: 0.18 }, 1.7).to("#lk-face", { x: 12, duration: 0.18 }, 2.15).to("#lk-face", { x: 0, duration: 0.18 }, 2.6)
  .to("#ck-head", { ...O, rotation: -12, duration: 0.25 }, 1.75).to("#ck-head", { ...O, rotation: 6, duration: 0.25 }, 2.2);
mouth("ck", "o", 1.75);
mouth("ck", "grin", 2.6);
tl.set("#title", { opacity: 1 }, 2.6)
  .fromTo("#title", { ...O, svgOrigin: "540 400", scale: 0.3, rotation: -8 }, { svgOrigin: "540 400", scale: 1, rotation: -4, duration: 0.4, ease: "back.out(2.5)", immediateRender: false }, 2.6);
// Kolurin's finger gun at the sky
gun(true, 3.0);
tl.to("#ck-armR", { ...O, rotation: 200, duration: 0.25, ease: "back.out(2)" }, 2.95)
  .to("#ck-armR", { ...O, rotation: 212, duration: 0.06 }, 3.4)
  .to("#ck-armR", { ...O, rotation: 200, duration: 0.2, ease: "elastic.out(1,0.4)" }, 3.46);
{
  const g = el("g", { transform: "translate(905,1190)" }), lines = el("g", { opacity: 0 }, g);
  for (let i = 0; i < 3; i++) el("path", { d: `M${i * 16},0 l-10,-34`, stroke: INK, "stroke-width": 7, "stroke-linecap": "round" }, lines);
  tl.set(lines, { opacity: 1 }, 3.4).set(lines, { opacity: 0 }, 4.1);
}
tl.to({}, { duration: 0.01 }, DURATION - 0.01);

const noise = document.getElementById("pencilNoise");
window.DURATION = DURATION;
window.renderAt = (t) => { tl.time(t, false); noise.setAttribute("seed", 1 + (Math.floor(t * 8) % 4)); };
window.ready = document.fonts.ready.then(() => {
  if (new URLSearchParams(location.search).has("render")) { document.body.classList.add("render"); renderAt(0); return; }
  let t0 = performance.now();
  (function loop(now) { renderAt(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(t0);
});
</script>
</body>
</html>
