  body.render .wrap { padding: 0; }

/* ------------------------------ helpers ------------------------------ */
const $ = (s) => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || $("#fx")).appendChild(n);
  return n;
}
const O = { svgOrigin: "0 0" };
const tl = gsap.timeline({ paused: true });

function mouth(who, name, t) {
  document.querySelectorAll(`[id^="${who}-mouth-"]`).forEach((m) =>
    tl.set(m, { opacity: m.id === `${who}-mouth-${name}` ? 1 : 0 }, t));
}
function land(who, t, power = 1) {
  tl.to(`#${who}-squash`, { ...O, scaleY: 1 - 0.22 * power, scaleX: 1 + 0.16 * power, duration: 0.07, ease: "power2.out" }, t)
    .to(`#${who}-squash`, { ...O, scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1.1,0.4)" }, t + 0.07);
}
function fall(who, x, t, dur = 0.45) {
  tl.set(`#${who}`, { x, y: -500 }, 0)
    .to(`#${who}`, { y: FLOOR, duration: dur, ease: "power2.in" }, t)
    .fromTo(`#${who}-squash`, { ...O, scaleY: 1.18, scaleX: 0.9 }, { ...O, scaleY: 1.18, scaleX: 0.9, duration: dur }, t)
    .to(`#${who}-legL`, { ...O, rotation: 12, duration: dur * 0.6 }, t)
    .to(`#${who}-legR`, { ...O, rotation: -12, duration: dur * 0.6 }, t)
    .to([`#${who}-legL`, `#${who}-legR`], { ...O, rotation: 0, duration: 0.2 }, t + dur);
  land(who, t + dur, 1.2);
  dust(x, FLOOR, t + dur);
}
function walk(who, fromX, toX, t, dur) {
  const steps = Math.max(2, Math.round(dur / 0.16));
  tl.fromTo(`#${who}`, { x: fromX }, { x: toX, duration: dur, ease: "none" }, t);
  for (let i = 0; i < steps; i++) {
    const s = i % 2 ? 1 : -1, st = t + (i * dur) / steps, d = dur / steps;
    tl.to(`#${who}-legL`, { ...O, rotation: 16 * s, duration: d, ease: "sine.inOut" }, st)

      .to(`#${who}-squash`, { ...O, scaleY: 1.03, duration: d / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, st);
  }
  tl.to([`#${who}-legL`, `#${who}-legR`], { ...O, rotation: 0, duration: 0.12 }, t + dur);
}
function dust(x, y, t) {
  for (let i = 0; i < 7; i++) {
    const s = i % 2 ? 1 : -1, c = el("circle", { cx: x, cy: y - 6, r: 10 + (i % 3) * 5, fill: PAPER, stroke: INK, "stroke-width": 4, opacity: 0 });
    tl.set(c, { opacity: 1 }, t)

      .to(c, { attr: { r: 0 }, duration: 0.5, ease: "power2.in" }, t);
  }
}
function impact(x, y, t, size = 80, color = INK) {
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + 0.3, cx = Math.cos(a), sy = Math.sin(a);
    const l = el("line", { x1: x + cx * size * 0.35, y1: y + sy * size * 0.35, x2: x + cx * size * 0.4, y2: y + sy * size * 0.4, stroke: color, "stroke-width": 7, "stroke-linecap": "round", opacity: 0 });
    tl.set(l, { opacity: 1 }, t)
      .to(l, { attr: { x1: x + cx * size * 0.8, y1: y + sy * size * 0.8, x2: x + cx * size * 1.25, y2: y + sy * size * 1.25 }, duration: 0.28, ease: "power3.out" }, t)
      .to(l, { opacity: 0, duration: 0.12 }, t + 0.2);
  }
}
function sfx(text, x, y, t, { size = 64, rot = -8, color = INK, hold = 0.55 } = {}) {
  const o = el("g", { transform: `translate(${x},${y})` }), g = el("g", { opacity: 0 }, o);
  el("text", { x: 0, y: 0, "text-anchor": "middle", "font-family": "Permanent Marker, cursive", "font-size": size, fill: color, stroke: PAPER, "stroke-width": 12, "paint-order": "stroke", "stroke-linejoin": "round" }, g).textContent = text;
  tl.set(g, { opacity: 1, rotation: rot, ...O }, t)
    .fromTo(g, { ...O, scale: 0.2 }, { ...O, scale: 1, duration: 0.3, ease: "back.out(3)" }, t)
    .to(g, { opacity: 0, duration: 0.25 }, t + hold);
}

function gunLines(x, y, t, hold = 0.6, rot = 0) {

  tl.set(g, { opacity: 1, rotation: rot, ...O }, t)
    .fromTo(g, { ...O, scale: 0.3 }, { ...O, scale: 1, duration: 0.2, ease: "back.out(3)" }, t)
    .to(g, { opacity: 0, duration: 0.15 }, t + hold);
}

function caption(text, t, until) {

}

/* ------------------------------ playback ------------------------------ */
const noise = document.getElementById("pencilNoise");
function boil(t) { noise.setAttribute("seed", 1 + (Math.floor(t * 8) % 4)); }
window.renderAt = (t) => { tl.time(t, false); boil(t); };
window.DURATION = DURATION;

const params = new URLSearchParams(location.search);
const btn = $("#play"), scrub = $("#scrub"), clock = $("#clock");
let playing = false, last = 0, now = 0;
function frame(ts) {
  if (playing) {
    now += (ts - last) / 1000;
    if (now >= DURATION) now = 0;
    renderAt(now);
    scrub.value = Math.round((now / DURATION) * 1000);
    clock.textContent = now.toFixed(1) + "s";
  }
  last = ts;
  requestAnimationFrame(frame);
}
function setPlaying(p) { playing = p; btn.textContent = p ? "Pause" : "Play"; }
btn.onclick = () => setPlaying(!playing);
svg.onclick = () => setPlaying(!playing);
scrub.oninput = () => { setPlaying(false); now = (scrub.value / 1000) * DURATION; renderAt(now); clock.textContent = now.toFixed(1) + "s"; };

window.ready = document.fonts.ready.then(() => {
  if (params.has("render")) { document.body.classList.add("render"); renderAt(+params.get("t") || 0); return; }
  renderAt(0); setPlaying(true); requestAnimationFrame((ts) => { last = ts; frame(ts); });
});
